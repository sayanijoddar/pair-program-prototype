<!DOCTYPE html>
<html>
<head>
    <title>Pair Program Prototype</title>
    <script src="https://unpkg.com/monaco-editor@0.50.0/min/vs/loader.js"></script>
    <style>
        body { margin: 0; font-family: -apple-system, sans-serif; height: 100vh; background: #1e1e1e; color: white; }
        #container { display: flex; flex-direction: column; height: 100vh; }
        #header { background: #252526; padding: 10px 20px; display: flex; gap: 15px; align-items: center; }
        #editor { flex: 1; }
        #status { background: #2d2d30; padding: 8px 20px; font-size: 13px; display: flex; justify-content: space-between; }
        button { background: #0e639c; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 500; }
        button:hover { background: #1177bb; }
        input { padding: 8px 12px; border: 1px solid #3c3c3c; border-radius: 4px; background: #3c3c3c; color: white; flex: 1; max-width: 300px; }
        #share-link { color: #4fc3f7; cursor: pointer; font-family: monospace; }
        #status-text { font-weight: 500; }
        .connected { color: #3fb950 !important; }
        .disconnected { color: #f85149 !important; }
    </style>
</head>
<body>
    <div id="container">
        <div id="header">
            <button id="new-room">New Room</button>
            <input id="room-id" placeholder="Enter room ID">
            <button id="join-room">Join Room</button>
            <span id="status-text" class="disconnected">Disconnected</span>
            <span id="share-link" style="display: none;"></span>
        </div>
        <div id="editor"></div>
        <div id="status">
            <span>👥 Press <strong>Ctrl+Space</strong> for AI Autocomplete (Groq-powered) | Smooth real-time sync</span>
            <span id="users-count">1 user online</span>
        </div>
    </div>

    <script>
        let editor, ws, roomId, debounceTimer;
        let isRemoteUpdate = false;
        let aiSuggestions = [];  // ✅ Store AI suggestions
        const SERVER_URL = 'ws://localhost:8000/ws/';
        const AUTOCOMPLETE_URL = 'http://localhost:8000/autocomplete';

        // Monaco Editor setup
        require.config({ paths: { vs: 'https://unpkg.com/monaco-editor@0.50.0/min/vs' } });
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: `#include <iostream>
using namespace std;

int main() {
    cout << "Hello Pair Programming! 👥" << endl;
    // Ctrl+Space for AI autocomplete 🚀
    // Type fast - smooth sync guaranteed!
    return 0;
}`,
                language: 'cpp',
                theme: 'vs-dark',
                minimap: { enabled: false },
                fontSize: 15,
                padding: { top: 12, bottom: 12 },
                scrollBeyondLastLine: false,
                automaticLayout: true,
                quickSuggestions: true
            });

            // ✅ FIXED: AI Autocomplete - Fetch + Store suggestions
            // ✅ FIXED: AI Autocomplete - Proper trigger + No duplicates
// ✅ BULLETPROOF Autocomplete - NO Monaco API errors!
editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Space, async function() {
    console.log('🔥 Ctrl+Space triggered!');
    
    const position = editor.getPosition();
    const model = editor.getModel();
    const fullCode = model.getValue();
    const cursorPos = model.getOffsetAt(position);
    
    console.log('Cursor at:', position, 'Offset:', cursorPos);
    
    try {
        const response = await fetch(AUTOCOMPLETE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                code: fullCode,
                cursor_pos: cursorPos
            })
        });
        
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        aiSuggestions = await response.json();
        console.log('✅ AI Suggestions:', aiSuggestions);
        
        // ✅ SIMPLIFIED: Direct Monaco suggestions (NO providers!)
        if (aiSuggestions.length > 0) {
            monaco.editor.setModelMarkers(model, 'ai-suggestions', []);
            
            // Show simple suggestions popup
            const suggestions = aiSuggestions.slice(0, 6).map(s => ({
                label: s.text,
                kind: s.type === 'keyword' ? monaco.languages.CompletionItemKind.Keyword :
                      s.type === 'function' ? monaco.languages.CompletionItemKind.Function :
                      monaco.languages.CompletionItemKind.Text,
                insertText: s.text,
                range: {
                    startLineNumber: position.lineNumber,
                    startColumn: Math.max(1, position.column - 5),
                    endLineNumber: position.lineNumber,
                    endColumn: position.column
                }
            }));
            
            // Trigger Monaco's built-in suggest widget
            editor.trigger('keyboard', 'editor.action.triggerSuggest', {});
            
            // Fallback: Manual quick info
            setTimeout(() => {
                monaco.editor.showSimpleSuggestions(editor, {
                    suggestions: suggestions,
                    incomplete: true
                });
            }, 100);
        }
        
    } catch(error) {
        console.error('❌ Autocomplete failed:', error);
    }
});



            // ✅ FIXED: Smart sync - NO LOOPS + NO JITTER
            editor.onDidChangeModelContent((event) => {
                if (isRemoteUpdate) return;
                
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: 'code_change',
                            code: editor.getValue()
                        }));
                    }
                }, 300);
            });
        });

        // UI Event Listeners
        document.getElementById('new-room').onclick = async () => {
            try {
                const response = await fetch('http://localhost:8000/rooms', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                roomId = data.roomId || data.room_id;
                
                if (!roomId) throw new Error('No roomId in response');
                
                connectWebSocket();
                document.getElementById('room-id').value = roomId;
                document.getElementById('share-link').textContent = `Share: localhost:3000/?room=${roomId}`;
                document.getElementById('share-link').style.display = 'inline';
                
            } catch(e) {
                console.error('Create room failed:', e);
                alert(`Failed to create room: ${e.message}`);
            }
        };

        document.getElementById('join-room').onclick = () => {
            roomId = document.getElementById('room-id').value.trim();
            if (roomId) {
                connectWebSocket();
            } else {
                alert('Enter a room ID');
            }
        };

        document.getElementById('share-link').onclick = (e) => {
            navigator.clipboard.writeText(`http://localhost:3000/?room=${roomId}`).then(() => {
                const original = e.target.textContent;
                e.target.textContent = 'Copied!';
                setTimeout(() => e.target.textContent = original, 2000);
            });
        };

        function connectWebSocket() {
            if (ws) ws.close();
            ws = new WebSocket(SERVER_URL + roomId);
            
            ws.onopen = () => {
                document.getElementById('status-text').textContent = `Connected: ${roomId}`;
                document.getElementById('status-text').className = 'connected';
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'init') {
                    isRemoteUpdate = true;
                    editor.setValue(data.code);
                    isRemoteUpdate = false;
                } else if (data.type === 'code_sync') {
                    const currentValue = editor.getValue();
                    if (data.code !== currentValue) {
                        isRemoteUpdate = true;
                        editor.setValue(data.code);
                        isRemoteUpdate = false;
                    }
                }
            };
            
            ws.onclose = () => {
                document.getElementById('status-text').textContent = 'Disconnected';
                document.getElementById('status-text').className = 'disconnected';
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                document.getElementById('status-text').textContent = 'Connection failed';
            };
        }

        // Auto-join from URL param
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('room')) {
            setTimeout(() => {
                document.getElementById('room-id').value = urlParams.get('room');
                document.getElementById('join-room').click();
            }, 1000);
        }
    </script>
</body>
</html>
